name: custom_map_search
description: A Flutter app showing Google Map with Places autocomplete search.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Google Maps widget for Flutter
  google_maps_flutter: ^2.3.0

  # Places API client for autocomplete & details
  google_place: ^0.4.7

  # Optional: for better typing & utilities
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true